<!DOCTYPE html>

<html>
<head>
    <title>Edit Event</title>

```
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        background: linear-gradient(to right, #ff9a9e, #fad0c4);
        font-family: Arial;
    }

    .form-card {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0px 5px 15px rgba(0,0,0,0.2);
    }

    .btn-update {
        background: #ff6b6b;
        color: white;
        border: none;
    }

    .btn-update:hover {
        background: #ff4b4b;
    }

    .back-link {
        text-decoration: none;
        color: white;
    }
</style>
```

</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">

```
<div class="col-md-5 form-card">

    <h3 class="text-center mb-4">Edit Event ✏️</h3>

    <form method="POST">

        <!-- TITLE -->
        <div class="mb-3">
            <label class="form-label"><b>Title</b></label>
            <input type="text" name="title" class="form-control" value="{{ event.title }}" required>
        </div>

        <!-- DESCRIPTION -->
        <div class="mb-3">
            <label class="form-label"><b>Description</b></label>
            <textarea name="description" class="form-control" rows="3" required>{{ event.description }}</textarea>
        </div>

        <!-- DATE -->
        <div class="mb-3">
            <label class="form-label"><b>Date</b></label>
            <input type="date" name="event_date" class="form-control" value="{{ event.event_date }}" required>
        </div>

        <!-- LOCATION -->
        <div class="mb-3">
            <label class="form-label"><b>Location</b></label>
            <input type="text" name="location" class="form-control" value="{{ event.location }}" required>
        </div>

        <button type="submit" class="btn btn-update w-100">Update Event</button>

    </form>

    <div class="text-center mt-3">
        <a href="/admin" class="back-link">⬅ Back to Admin</a>
    </div>

</div>
```

</div>

</body>
</html>
