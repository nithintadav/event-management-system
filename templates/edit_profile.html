{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}

{% block content %}
<section class="container" style="padding: 60px 0;">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="feature-box reveal is-visible">
        <h3 class="font-display mb-4">Edit Profile</h3>

        {% if user.profile_image %}
        <img src="{{ url_for('static', filename='uploads/' ~ user.profile_image) }}" class="rounded-circle mb-3" style="width:90px; height:90px; object-fit:cover;">
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" value="{{ user.email }}" disabled>
            <div class="form-text">Email cannot be changed.</div>
          </div>

          <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" name="phone" class="form-control" value="{{ user.phone or '' }}">
          </div>

          <div class="mb-3">
            <label class="form-label">Profile Photo</label>
            <input type="file" name="profile_image" accept="image/*" class="form-control">
          </div>

          <button type="submit" class="btn btn-signal w-100">Save Changes</button>
        </form>

        <div class="text-center mt-3">
          <a href="{{ url_for('dashboard') }}" class="text-decoration-none">⬅ Back to Dashboard</a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
