<!DOCTYPE html>

<html>
<head>
    <title>Events</title>


<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        background: #f4f6f9;
        font-family: Arial;
    }

    .card {
        border-radius: 12px;
        transition: transform 0.2s;
    }

    .card:hover {
        transform: scale(1.03);
    }

    .search-box {
        background: white;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
    }

    .btn-book {
        background: #007bff;
        color: white;
    }

    .btn-book:hover {
        background: #0056b3;
    }
</style>


</head>

<body>

<div class="container mt-4">


<h3 class="mb-3">Browse Events 🔍</h3>

<!-- SEARCH FILTER -->
<form method="GET" class="search-box mb-4">

    <div class="row">

        <div class="col-md-4">
            <input type="text" name="search" placeholder="Search by title" class="form-control">
        </div>

        <div class="col-md-3">
            <input type="text" name="location" placeholder="Location" class="form-control">
        </div>

        <div class="col-md-3">
            <input type="date" name="date" class="form-control">
        </div>

        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Search</button>
        </div>

    </div>

</form>

<!-- EVENTS -->
<div class="row">

    {% for event in events %}
    <div class="col-md-4 mb-4">

        <div class="card shadow p-3">

            <h5>{{ event.title }}</h5>

            <p>{{ event.description }}</p>

            <p><b>📅 {{ event.event_date }}</b></p>

            <p>📍 {{ event.location }}</p>

            <a href="/book_event/{{ event.id }}" class="btn btn-book w-100">
                Book Event
            </a>

        </div>

    </div>
    {% endfor %}

</div>


</div>

</body>
</html>
