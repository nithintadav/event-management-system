{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<section class="container" style="padding: 70px 0;">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="feature-box reveal is-visible">
        <div class="text-center mb-4">
          <span class="hero-badge" style="color: var(--coral); border-color: rgba(228,87,46,0.3);">Join Eventra</span>
          <h3 class="font-display mt-3">Create Your Account</h3>
        </div>

        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" minlength="8" required>
            <div class="form-text">At least 8 characters.</div>
          </div>

          <button type="submit" class="btn btn-signal w-100">Register</button>
        </form>

        <div class="perforation my-4"></div>

        <a href="{{ url_for('login') }}" class="btn btn-outline-secondary w-100">
          Already have an account? Login
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
