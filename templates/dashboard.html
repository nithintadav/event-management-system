<!DOCTYPE html>

<html>
<head>
<title>User Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
<div class="container-fluid">

<a class="navbar-brand">Event System</a>

<div>
<a href="/logout" class="btn btn-danger">Logout</a>
</div>

</div>
</nav>

<div class="container mt-5">

<h2 class="mb-4">Welcome {{ name }}</h2>

<div class="row">

<div class="col-md-4 mb-4">

<div class="card shadow h-100 text-center">

<div class="card-body">

<h4 class="card-title">Browse Events</h4>

<p class="card-text">
Explore available events and register for your favorite ones.
</p>

<a href="/events" class="btn btn-success">
View Events
</a>

</div>

</div>

</div>

<div class="col-md-4 mb-4">

<div class="card shadow h-100 text-center">

<div class="card-body">

<h4 class="card-title">My Bookings</h4>

<p class="card-text">
Check all events you have registered for.
</p>

<a href="/my_bookings" class="btn btn-primary">
My Bookings
</a>

</div>

</div>

</div>

<div class="col-md-4 mb-4">

<div class="card shadow h-100 text-center">

<div class="card-body">

<h4 class="card-title">Account</h4>

<p class="card-text">
Manage your session and logout securely.
</p>

<a href="/logout" class="btn btn-danger">
Logout
</a>

</div>

</div>

</div>

</div>

</div>

</body>
</html>
