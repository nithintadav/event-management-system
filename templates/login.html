{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<section class="container" style="padding: 70px 0;">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="feature-box reveal is-visible">
        <div class="text-center mb-4">
          <span class="hero-badge" style="color: var(--teal); border-color: rgba(14,110,99,0.3);">Welcome Back</span>
          <h3 class="font-display mt-3">Login to Eventra</h3>
        </div>

        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
          </div>

          <button type="submit" class="btn btn-signal w-100">Login</button>
        </form>

        <div class="perforation my-4"></div>

        <a href="{{ url_for('register') }}" class="btn btn-outline-secondary w-100">
          New here? Create an account
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
